# arduino-cli project file: pins the board, core and library versions so any
# machine builds the same firmware. `arduino-cli compile` / `upload` in this
# folder pick it up automatically and install anything missing.
profiles:
  default:
    notes: ESP32-C3 Super Mini + 0.96" SSD1306 OLED
    # Board "Nologo ESP32C3 Super Mini", USB CDC On Boot: Enabled (default)
    fqbn: esp32:esp32:nologo_esp32c3_super_mini
    platforms:
      - platform: esp32:esp32 (3.3.12)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - U8g2 (2.36.19)
      - ArduinoJson (7.4.3)

default_profile: default
